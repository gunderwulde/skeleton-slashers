<svg xmlns="http://www.w3.org/2000/svg" width="96" height="32" viewBox="0 0 96 32" shape-rendering="crispEdges">
  <defs>
    <style>
      .outline { fill: #171923; }
      .steel { fill: #9aa4b5; }
      .steel-light { fill: #d1d8e2; }
      .steel-dark { fill: #596273; }
      .leather { fill: #70452d; }
      .red { fill: #b83b46; }
      .skin { fill: #d89b72; }
      .gold { fill: #d3a83d; }
    </style>
  </defs>

  <!-- Frame 0: standing -->
  <g>
    <rect class="outline" x="10" y="3" width="13" height="3"/>
    <rect class="outline" x="7" y="6" width="19" height="8"/>
    <rect class="steel-dark" x="9" y="6" width="15" height="6"/>
    <rect class="steel-light" x="11" y="6" width="10" height="2"/>
    <rect class="skin" x="11" y="11" width="10" height="4"/>
    <rect class="outline" x="13" y="12" width="2" height="2"/>
    <rect class="outline" x="19" y="12" width="2" height="2"/>
    <rect class="red" x="8" y="15" width="18" height="9"/>
    <rect class="steel" x="11" y="15" width="12" height="9"/>
    <rect class="steel-light" x="12" y="16" width="4" height="6"/>
    <rect class="gold" x="15" y="18" width="4" height="3"/>
    <rect class="leather" x="8" y="16" width="3" height="8"/>
    <rect class="leather" x="23" y="16" width="3" height="8"/>
    <rect class="outline" x="11" y="24" width="5" height="6"/>
    <rect class="outline" x="18" y="24" width="5" height="6"/>
    <rect class="steel-dark" x="12" y="24" width="3" height="5"/>
    <rect class="steel-dark" x="19" y="24" width="3" height="5"/>
    <rect class="outline" x="27" y="14" width="3" height="12"/>
    <rect class="steel-light" x="28" y="10" width="2" height="5"/>
    <rect class="leather" x="27" y="25" width="4" height="2"/>
  </g>

  <!-- Frame 1: left foot forward -->
  <g transform="translate(32 0)">
    <rect class="outline" x="10" y="3" width="13" height="3"/>
    <rect class="outline" x="7" y="6" width="19" height="8"/>
    <rect class="steel-dark" x="9" y="6" width="15" height="6"/>
    <rect class="steel-light" x="11" y="6" width="10" height="2"/>
    <rect class="skin" x="11" y="11" width="10" height="4"/>
    <rect class="outline" x="13" y="12" width="2" height="2"/>
    <rect class="outline" x="19" y="12" width="2" height="2"/>
    <rect class="red" x="8" y="15" width="18" height="9"/>
    <rect class="steel" x="11" y="15" width="12" height="9"/>
    <rect class="steel-light" x="12" y="16" width="4" height="6"/>
    <rect class="gold" x="15" y="18" width="4" height="3"/>
    <rect class="leather" x="8" y="16" width="3" height="8"/>
    <rect class="leather" x="23" y="16" width="3" height="8"/>
    <rect class="outline" x="9" y="24" width="5" height="6"/>
    <rect class="outline" x="19" y="24" width="5" height="6"/>
    <rect class="steel-dark" x="10" y="24" width="3" height="5"/>
    <rect class="steel-dark" x="20" y="24" width="3" height="5"/>
    <rect class="outline" x="27" y="14" width="3" height="12"/>
    <rect class="steel-light" x="28" y="10" width="2" height="5"/>
    <rect class="leather" x="27" y="25" width="4" height="2"/>
  </g>

  <!-- Frame 2: right foot forward -->
  <g transform="translate(64 0)">
    <rect class="outline" x="10" y="3" width="13" height="3"/>
    <rect class="outline" x="7" y="6" width="19" height="8"/>
    <rect class="steel-dark" x="9" y="6" width="15" height="6"/>
    <rect class="steel-light" x="11" y="6" width="10" height="2"/>
    <rect class="skin" x="11" y="11" width="10" height="4"/>
    <rect class="outline" x="13" y="12" width="2" height="2"/>
    <rect class="outline" x="19" y="12" width="2" height="2"/>
    <rect class="red" x="8" y="15" width="18" height="9"/>
    <rect class="steel" x="11" y="15" width="12" height="9"/>
    <rect class="steel-light" x="12" y="16" width="4" height="6"/>
    <rect class="gold" x="15" y="18" width="4" height="3"/>
    <rect class="leather" x="8" y="16" width="3" height="8"/>
    <rect class="leather" x="23" y="16" width="3" height="8"/>
    <rect class="outline" x="11" y="24" width="5" height="6"/>
    <rect class="outline" x="18" y="24" width="5" height="6"/>
    <rect class="steel-dark" x="12" y="24" width="3" height="5"/>
    <rect class="steel-dark" x="19" y="24" width="3" height="5"/>
    <rect class="outline" x="27" y="14" width="3" height="12"/>
    <rect class="steel-light" x="28" y="10" width="2" height="5"/>
    <rect class="leather" x="27" y="25" width="4" height="2"/>
  </g>
</svg>
